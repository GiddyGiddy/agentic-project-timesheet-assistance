[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-project-timesheet-assistant"
version = "0.1.0"
description = "Human-approved, agent-assisted project timesheets"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-mcp-adapters>=0.3.2,<1",
    "openpyxl>=3.1,<4",
    "sqlalchemy>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "msal>=1.31,<2",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.10"]

[project.scripts]
timesheet = "src.main:main"
timesheet-ui = "src.web.app:main"

[project.gui-scripts]
timesheet-desktop = "src.desktop:main"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.setuptools.package-data]
"config" = ["*.json"]
"src.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
