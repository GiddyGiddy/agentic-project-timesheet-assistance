name: Windows standalone build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.2'
          architecture: x64

      - name: Install application and build dependencies
        run: python -m pip install -e ".[dev,build]"

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build and verify unsigned distribution
        run: .\windows\build.ps1 -Python "${{ steps.python.outputs.python-path }}"

      - name: Build and validate unsigned Preview MSIX
        run: .\windows\build-msix.ps1 -Python "${{ steps.python.outputs.python-path }}" -Revision $env:GITHUB_RUN_NUMBER
